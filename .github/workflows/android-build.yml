name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # diperlukan untuk membuat GitHub Release pada tag v*

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Jalankan unit test (AI Jason & validitas map)
        run: gradle :core:test --stacktrace
      - name: Upload laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  build:
    name: Build APK & AAB
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Siapkan keystore rilis (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipasang."
          else
            echo "::notice::KEYSTORE_BASE64 tidak diset; build rilis ditandatangani dengan debug key (hanya untuk uji)."
          fi

      - name: Tentukan versi
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK, release APK, release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :android:assembleDebug :android:assembleRelease :android:bundleRelease --stacktrace

      - name: Kumpulkan artefak
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/debug/*.apk dist/jason-hide-seek-debug.apk
          cp android/build/outputs/apk/release/*.apk dist/jason-hide-seek-release.apk
          cp android/build/outputs/bundle/release/*.aab dist/jason-hide-seek-release.aab
          ls -lh dist

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: jason-hide-seek-android
          path: dist/*
          retention-days: 30

      - name: Publikasikan GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
